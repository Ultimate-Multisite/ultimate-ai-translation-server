name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to deploy
        required: true
        type: string

env:
  ADDON_SLUG: gratis-ai-translations-server

jobs:
  build-and-release:
    name: Build and Create Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.repository == 'Ultimate-Multisite/ultimate-ai-translation-server'
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_FILE="${ADDON_SLUG}.php"

          PLUGIN_VERSION=$(grep -oP '^\s*\*?\s*Version:\s*\K.*' "${PLUGIN_FILE}" | tr -d '[:space:]')
          if [ "${PLUGIN_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Plugin header version (${PLUGIN_VERSION}) does not match tag (${TAG_VERSION})"
            exit 1
          fi

          CONST_VERSION=$(grep -oP "define\(\s*'GRATIS_AI_TS_VERSION'\s*,\s*'\K[^']+" "${PLUGIN_FILE}" || true)
          if [ "${CONST_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Version constant (${CONST_VERSION}) does not match tag (${TAG_VERSION})"
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::package.json version (${PKG_VERSION}) does not match tag (${TAG_VERSION})"
            exit 1
          fi

          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "${FILE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::VERSION file (${FILE_VERSION}) does not match tag (${TAG_VERSION})"
            exit 1
          fi

          STABLE_TAG=$(grep -oP '^Stable tag:\s*\K.*' readme.txt | tr -d '[:space:]')
          if [ "${STABLE_TAG}" != "${TAG_VERSION}" ]; then
            echo "::error::readme.txt Stable tag (${STABLE_TAG}) does not match tag (${TAG_VERSION})"
            exit 1
          fi

          if ! grep -qP "Version\s+${TAG_VERSION}\s+-\s+Released on" readme.txt; then
            echo "::error::readme.txt has no changelog entry for version ${TAG_VERSION}"
            exit 1
          fi

          echo "All version checks passed: ${TAG_VERSION}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, sodium
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build addon
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ADDON_SLUG }}-zip
          path: ${{ env.ADDON_SLUG }}.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ADDON_SLUG }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  deploy-to-woocommerce:
    name: Deploy to WooCommerce Marketplace
    runs-on: ubuntu-latest
    needs: build-and-release
    if: >-
      always() &&
      github.repository == 'Ultimate-Multisite/ultimate-ai-translation-server' &&
      (github.event_name == 'workflow_dispatch' || needs.build-and-release.result == 'success')
    permissions:
      contents: read

    steps:
      - name: Checkout addon
        uses: actions/checkout@v6
        with:
          path: ${{ env.ADDON_SLUG }}
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download build artifact
        if: github.event_name == 'push'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ADDON_SLUG }}-zip
          path: ${{ env.ADDON_SLUG }}

      - name: Download existing release asset
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          gh release download "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --pattern "${ADDON_SLUG}.zip"
          --dir "${ADDON_SLUG}"

      - name: Checkout deployment tool
        uses: actions/checkout@v6
        with:
          repository: Ultimate-Multisite/addon-deployment-tool
          path: addon-deployment-tool
          token: ${{ secrets.PAT }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl
          coverage: none

      - name: Install deployment tool
        working-directory: addon-deployment-tool
        run: composer install --no-dev --optimize-autoloader

      - name: Route marketplace API directly to origin
        env:
          MARKETPLACE_ORIGIN_IP: ${{ secrets.MARKETPLACE_ORIGIN_IP }}
        run: |
          if [ -n "${MARKETPLACE_ORIGIN_IP}" ]; then
            sudo sh -c 'printf "%s\tultimatemultisite.com\n" "$1" >> /etc/hosts' sh "${MARKETPLACE_ORIGIN_IP}"
          fi

      - name: Deploy to WooCommerce
        working-directory: addon-deployment-tool
        env:
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          MARKETPLACE_URL: https://ultimatemultisite.com
          GLOTPRESS_URL: https://translate.ultimatemultisite.com
          TRADUTTORE_WEBHOOK_SECRET: ${{ secrets.TRADUTTORE_WEBHOOK_SECRET }}
          NOTIFICATION_FROM_EMAIL: noreply@ultimatemultisite.com
          NOTIFICATION_FROM_NAME: Ultimate Multisite
        run: |
          printf 'y\n' | ./bin/deploy-addon deploy ${{ env.ADDON_SLUG }} \
            --addons-dir=../ \
            --skip-build \
            --skip-version-bump \
            --skip-ci-check \
            --verbose
